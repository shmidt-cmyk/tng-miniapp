<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TNG Pokrovka</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --danger: #e63946;
      --success: #2a9d8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; }

    header {
      position: sticky; top: 0; background-color: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--gold);
      padding: 15px; text-align: center; z-index: 100;
    }
    header h1 { color: var(--gold); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }

    .container { max-width: 600px; margin: 15px auto; padding: 0 10px; }

    .swipe-container { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 12px; }
    .delete-btn-behind {
      position: absolute; right: 0; top: 0; bottom: 0; width: 80px;
      background-color: var(--danger); color: white; display: flex;
      align-items: center; justify-content: center; font-size: 20px; border: none; cursor: pointer;
    }

    .card {
      background-color: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px; transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative; z-index: 2;
    }
    .card.open { border-color: var(--gold); }

    .card-header {
      padding: 16px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; background-color: var(--card-bg); border-radius: 8px;
    }
    .intern-name { font-size: 16px; font-weight: 600; color: var(--text-color); text-decoration: none; display: inline-block; }
    .card.open .intern-name { color: var(--gold); }
    .arrow { color: var(--gold); transition: transform 0.3s ease; margin-left: 10px; }
    .card.open .arrow { transform: rotate(180deg); }

    .card-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid rgba(255,255,255,0.05); }
    .card.open .card-body { display: block; }

    .block-section { margin-top: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; }
    .block-header-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .block-title { font-size: 14px; color: var(--gold); font-weight: 600; }
    .block-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: var(--text-muted); }
    .block-badge.done { background: rgba(42, 157, 143, 0.2); color: var(--success); font-weight: 600; }

    .task-item { display: flex; align-items: flex-start; margin-bottom: 8px; cursor: pointer; }
    .task-item input { display: none; }
    .custom-checkbox {
      width: 18px; height: 18px; border: 1px solid var(--gold); border-radius: 4px;
      margin-right: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
    }
    .task-item input:checked + .custom-checkbox { background-color: var(--gold); }
    .task-item input:checked + .custom-checkbox::after { content: '✓'; color: #000; font-size: 12px; font-weight: bold; }
    .task-text { font-size: 13px; color: var(--text-color); line-height: 1.3; }

    .comments-section { margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(212, 175, 55, 0.2); }
    .comments-list { max-height: 120px; overflow-y: auto; margin-bottom: 8px; }
    .comment-item { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.03); padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; }
    .comment-author { color: var(--gold); font-weight: bold; }

    .comment-input-group { display: flex; gap: 6px; }
    .comment-input {
      flex: 1; background: #121212; border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 12px; outline: none;
    }
    .comment-btn {
      background: var(--gold); color: #000; border: none; padding: 6px 12px;
      border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .comment-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .add-btn {
      width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold);
      padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--gold); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal-title { color: var(--gold); font-size: 16px; margin-bottom: 12px; }
    .modal-input { width: 100%; background: #121212; border: 1px solid rgba(212,175,55,0.4); border-radius: 4px; padding: 10px; color: #fff; margin-bottom: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

    .medbook-badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3); color: var(--text-muted);
      padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-top: 6px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .medbook-badge.active { background: rgba(212, 175, 55, 0.15); border-color: var(--gold); color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>TNG Pokrovka</h1>
  </header>

  <div class="container">
    <div id="interns-list"></div>
    <button class="add-btn" onclick="openAddModal()">+ Добавить стажера</button>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-title">Новый стажер</div>
      <input type="text" id="newInternName" class="modal-input" placeholder="ФИО Стажера">
      <input type="text" id="newInternUsername" class="modal-input" placeholder="Username Telegram (без @)">
      <div class="modal-actions">
        <button class="comment-btn" style="background:#444; color:#fff;" onclick="closeAddModal()">Отмена</button>
        <button class="comment-btn" id="saveInternBtn" onclick="submitAddIntern()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz_937-0mAvf5VNpqS0UJC3HKhBLLxuTOkq2bXV-LphOhpRAHlCh2uO-C6_UnBHsngh/exec';

    // Telegram Web App Инициализация
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    
    const tgUser = tg?.initDataUnsafe?.user;
    const currentUser = tgUser ? `${tgUser.first_name} (${tgUser.username || 'Менеджер'})` : 'Менеджер';

    // ==========================================
    // 🚧 РЕЖИМ ТЕХНИЧЕСКИХ РАБОТ
    // ==========================================
    const ADMIN_USERNAME = 'enot0110'; // Строка в кавычках!
    
    if (!tgUser || tgUser.username !== ADMIN_USERNAME) {
      document.body.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; padding: 20px; background-color: var(--bg-color);">
            <div style="font-size: 50px; margin-bottom: 20px;">🚧</div>
            <h1 style="color: var(--gold); margin-bottom: 15px; font-size: 22px;">Технические работы</h1>
            <p style="color: var(--text-color); font-size: 15px; line-height: 1.5;">
              Приложение временно закрыто на обслуживание.<br>Мы выкатываем обновление! Возвращайтесь позже.
            </p>
        </div>
      `;
      throw new Error("Остановка скрипта: включен режим тех. работ."); 
    }
    // ==========================================

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const BLOCKS = [
      { title: "Блок 1", tasks: ["История бренда TNG, корпоративная культура и внутренний распорядок", "Знакомство с программой лояльности и скидками ПГ", "Помощь в открытии и разбор чек-листа открытия, нумерация столов", "Разбор посуды кухни и бара. Знакомство с чатом по обучению", "Работа в зале и разбор всех станций", "Смена 4-6 часов", "Домашнее задание: выучить нумерацию, посуду, чек-листы, историю и правила"] },
      { title: "Блок 2", tasks: ["Проверка знаний первого блока", "Стандарты сервировки и обслуживания. Типы гостей", "Алгоритм действий. Знакомство с Restoplace", "Практика встречи и общения с гостями", "Смена 6 часов, разбор меню кухни", "Чек-лист закрытия стола", "Домашнее задание: алгоритм обслуживания, сервировка, выход из конфликтов"] },
      { title: "Блок 3", tasks: ["Проверка знаний. Разбор депозитов и их учет", "Работа полностью в помощь официанту", "Разбор меню кухни (закуски, салаты, десерты)", "Смена 12 часов", "Домашнее задание: закуски, салаты, десерты"] },
      { title: "Блок 4", tasks: ["Проверка знаний", "Стажировка на кухне 2-3 часа (в момент заказов)", "Разбор меню кухни (роллы, суши, гунканы)", "Работа в зале", "Смена 12 часов", "Домашнее задание: роллы, суши, гунканы"] },
      { title: "Блок 5", tasks: ["Проверка знаний", "Стажировка на кухне 2-3 часа. Работа в зале", "Разбор меню кухни (горячее, гарниры, супы, соусы)", "Работа с ПКО", "Смена 12 часов", "Домашнее задание: горячее, гарниры, супы, соусы"] },
      { title: "Блок 6", tasks: ["Сдача меню кухни шеф-повару", "Стажировка на баре 2-3 часа", "Работа в зале. Разбор всего бара", "Смена 12 часов", "Домашнее задание: весь бар"] },
      { title: "Блок 7", tasks: ["Проверка знаний", "Гастропары, повышение продаж, таблица продуктов и аллергенов", "Изучение меню бара (коктейли, кордиалы)", "Работа в зале под руководством старшего официанта", "Смена 12 часов", "Домашнее задание: коктейли, кордиалы"] },
      { title: "Блок 8", tasks: ["Проверка аллергенов, коктейлей и кордиалов", "Винная карта. Подача вина, работа с декантером. Крепкий алкоголь", "Смена 12 часов", "Самостоятельное принятие заказа под присмотром"] },
      { title: "Блок 9", tasks: ["Сдача меню бара бар-менеджеру", "Изучение меню ланчей и завтраков", "Смена 12 часов. Подготовка к контрольному обслуживанию (КО)", "Домашнее задание: завтраки, ланчи, подготовка к КО", "Прохождение контрольного обслуживания"] }
    ];
    
    let internsData = [];
    let openCardIndexes = new Set(); // Сохранение открытых карточек

    async function loadData() {
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        const json = await res.json();
        internsData = json.interns || [];
        renderInterns();
      } catch(err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function renderInterns() {
      const listEl = document.getElementById('interns-list');
      listEl.innerHTML = '';

      if (internsData.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; color:#a0a0a0; margin-top: 20px;">Нет стажеров в базе</p>';
        return;
      }

      internsData.forEach((intern, i) => {
        const container = document.createElement('div');
        container.className = 'swipe-container';

        const isOpen = openCardIndexes.has(i);

        container.innerHTML = `
          <button class="delete-btn-behind" onclick="confirmDelete(${i})">🗑️</button>
          <div class="card ${isOpen ? 'open' : ''}" id="card-${i}">
            <div class="card-header" onclick="toggleCard(${i})">
              <div>
                <a href="${intern.username ? 'https://t.me/' + intern.username : '#'}" target="_blank" class="intern-name" onclick="event.stopPropagation()">
                  ${escapeHtml(intern.name)} ${intern.username ? '(@' + escapeHtml(intern.username) + ')' : ''}
                </a>
                <div style="margin-top: 4px;">
                  <div class="medbook-badge ${intern.hasMedBook ? 'active' : ''}" onclick="toggleMedBook(event, ${i}, this)">
                    🩺 Медкнижка: <span class="status-text">${intern.hasMedBook ? 'Есть' : 'Отсутствует'}</span>
                  </div>
                </div>
              </div>
              <span class="arrow">▼</span>
            </div>
            <div class="card-body">
              ${BLOCKS.map((block, bIdx) => {
                const bNum = bIdx + 1;
                const rawState = intern.checkboxes ? intern.checkboxes['block_' + bNum] : [];
                let blockTasksState = [];
                if (rawState === true) {
                  blockTasksState = new Array(block.tasks.length).fill(true);
                } else if (Array.isArray(rawState)) {
                  blockTasksState = rawState;
                }

                const completedCount = blockTasksState.filter(Boolean).length;
                const isAllDone = completedCount === block.tasks.length && block.tasks.length > 0;
                const comments = intern.comments ? (intern.comments['block_' + bNum] || []) : [];
                
                return `
                  <div class="block-section">
                    <div class="block-header-line">
                      <div class="block-title">${block.title}</div>
                      <span class="block-badge ${isAllDone ? 'done' : ''}">${completedCount}/${block.tasks.length}</span>
                    </div>
                    ${block.tasks.map((taskText, tIdx) => {
                      const isChecked = !!blockTasksState[tIdx];
                      return `
                        <label class="task-item">
                          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask(${i}, ${bNum}, ${tIdx}, this.checked)">
                          <div class="custom-checkbox"></div>
                          <span class="task-text">${escapeHtml(taskText)}</span>
                        </label>
                      `;
                    }).join('')}
                    <div class="comments-section">
                      <div class="comments-list" id="comments-list-${i}-${bNum}">
                        ${comments.map(c => `<div class="comment-item"><span class="comment-author">[${escapeHtml(c.time)}] ${escapeHtml(c.author)}:</span> ${escapeHtml(c.text)}</div>`).join('')}
                      </div>
                      <div class="comment-input-group">
                        <input type="text" class="comment-input" placeholder="Комментарий..." id="input-${i}-${bNum}">
                        <button class="comment-btn" id="btn-comment-${i}-${bNum}" onclick="sendComment(${i}, ${bNum})">➤</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        listEl.appendChild(container);
        setupSwipe(`card-${i}`);
      });
    }

    function toggleCard(idx) {
      const card = document.getElementById(`card-${idx}`);
      if (!card) return;
      card.classList.toggle('open');
      if (card.classList.contains('open')) {
        openCardIndexes.add(idx);
      } else {
        openCardIndexes.delete(idx);
      }
    }

    async function toggleTask(internIdx, blockIndex, taskIndex, isChecked) {
      const intern = internsData[internIdx];
      if (!intern) return;

      if (!intern.checkboxes) intern.checkboxes = {};
      const totalTasks = BLOCKS[blockIndex - 1].tasks.length;
      let blockTasks = intern.checkboxes['block_' + blockIndex];

      if (blockTasks === true) {
        blockTasks = new Array(totalTasks).fill(true);
      }
      if (!Array.isArray(blockTasks) || blockTasks.length !== totalTasks) {
        blockTasks = new Array(totalTasks).fill(false);
      }

      blockTasks[taskIndex] = isChecked;
      intern.checkboxes['block_' + blockIndex] = blockTasks;

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'toggleTask',
          name: intern.name,
          blockIndex: blockIndex,
          tasksState: blockTasks,
          totalTasks: totalTasks
        })
      });
    }

    async function sendComment(internIdx, blockIndex) {
      const intern = internsData[internIdx];
      if (!intern) return;

      const input = document.getElementById(`input-${internIdx}-${blockIndex}`);
      const btn = document.getElementById(`btn-comment-${internIdx}-${blockIndex}`);
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      const commentObj = { author: currentUser, time: timeStr, text: text };

      // Оптимистичное добавление в DOM
      if (!intern.comments) intern.comments = {};
      if (!intern.comments['block_' + blockIndex]) intern.comments['block_' + blockIndex] = [];
      intern.comments['block_' + blockIndex].unshift(commentObj);

      const commentsContainer = document.getElementById(`comments-list-${internIdx}-${blockIndex}`);
      if (commentsContainer) {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<span class="comment-author">[${escapeHtml(commentObj.time)}] ${escapeHtml(commentObj.author)}:</span> ${escapeHtml(commentObj.text)}`;
        commentsContainer.insertBefore(item, commentsContainer.firstChild);
      }

      input.value = '';

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addComment', name: intern.name, blockIndex, comment: commentObj })
        });
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleMedBook(e, internIdx, badgeEl) {
      e.stopPropagation();
      const intern = internsData[internIdx];
      if (!intern) return;

      const isActive = badgeEl.classList.toggle('active');
      intern.hasMedBook = isActive;
      const statusText = badgeEl.querySelector('.status-text');
      statusText.textContent = isActive ? 'Есть' : 'Отсутствует';

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'toggleMedBook', name: intern.name, value: isActive })
      });
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
    
    async function submitAddIntern() {
      const nameInput = document.getElementById('newInternName');
      const usernameInput = document.getElementById('newInternUsername');
      const saveBtn = document.getElementById('saveInternBtn');
      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();
      if (!name) return;

      saveBtn.disabled = true;
      closeAddModal();

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addIntern', name, username })
        });
        nameInput.value = '';
        usernameInput.value = '';
        await loadData();
      } finally {
        saveBtn.disabled = false;
      }
    }

    function confirmDelete(internIdx) {
      const intern = internsData[internIdx];
      if (!intern) return;

      const message = `Удалить стажера ${intern.name} и весь прогресс?`;
      
      const doDelete = async () => {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteIntern', name: intern.name })
        });
        openCardIndexes.delete(internIdx);
        loadData();
      };

      if (tg?.showConfirm) {
        tg.showConfirm(message, (ok) => { if (ok) doDelete(); });
      } else if (confirm(message)) {
        doDelete();
      }
    }

    function setupSwipe(id) {
      const el = document.getElementById(id);
      let startX = 0;
      let startY = 0;
      let isHorizontal = false;

      el.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isHorizontal = false;
      }, { passive: true });

      el.addEventListener('touchmove', e => {
        const diffX = e.touches[0].clientX - startX;
        const diffY = e.touches[0].clientY - startY;

        if (!isHorizontal && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
          isHorizontal = true;
        }

        if (isHorizontal && diffX < 0 && diffX > -100) {
          el.style.transform = `translateX(${diffX}px)`;
        }
      }, { passive: true });

      el.addEventListener('touchend', e => {
        if (!isHorizontal) return;
        const diffX = e.changedTouches[0].clientX - startX;
        if (diffX < -40) {
          el.style.transform = `translateX(-80px)`;
        } else {
          el.style.transform = `translateX(0px)`;
        }
      });
    }

    loadData();
  </script>
</body>
</html>
